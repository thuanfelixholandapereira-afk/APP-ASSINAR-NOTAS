<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Assinador PDF</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="signature.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding:22px 18px}h1{font-size:24px;margin:0 0 5px}p{color:#667085;font-size:14px;margin:0 0 18px}.drop{border:2px dashed #b7c1cb;border-radius:14px;padding:36px 16px;text-align:center;background:#fafbfc;display:block;cursor:pointer}.drop b{display:block;font-size:17px;margin-bottom:7px}#files{display:none}.list{margin:16px 0;font-size:13px}.item{padding:9px 0;border-bottom:1px solid #eee;word-break:break-word}details{margin-top:14px;border:1px solid #e0e5ea;border-radius:12px;padding:12px}summary{font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}label{font-size:12px;color:#667085;display:block;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #d8dee4;border-radius:9px;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:15px;margin-top:18px;background:#1769aa;color:#fff;font-size:16px;font-weight:700}button:disabled{opacity:.45}#status{font-size:13px;margin-top:12px;color:#667085;text-align:center}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>Assinador de PDF</h1>
<p>Selecione uma ou mais notas em PDF.</p>
<label class="drop" for="files"><b>Toque para escolher os PDFs</b><span>Você pode selecionar vários arquivos.</span></label>
<input id="files" type="file" accept="application/pdf" multiple>
<div id="list" class="list"></div>
<details><summary>Ajustar posição da assinatura</summary><div class="grid">
<div><label>Largura da assinatura (cm)</label><input id="width" type="number" step="0.1" value="4.1"></div>
<div><label>Distância da borda inferior (cm)</label><input id="bottom" type="number" step="0.1" value="8"></div>
<div><label>Distância da borda superior (cm)</label><input id="top" type="number" step="0.1" placeholder="opcional"></div>
<div><label>Distância da borda esquerda (cm)</label><input id="left" type="number" step="0.1" placeholder="opcional"></div>
<div><label>Distância da borda direita (cm)</label><input id="right" type="number" step="0.1" placeholder="opcional"></div>
</div></details>
<button id="sign" disabled>Assinar e salvar</button>
<div id="status"></div>
</div>
<script>
const SIG='data:image/png;base64,'+window.SIG_B64;
const $=id=>document.getElementById(id);let selected=[];
$('files').onchange=e=>{selected=[...e.target.files];$('sign').disabled=!selected.length;$('list').innerHTML=selected.map(f=>'<div class="item">'+f.name+'</div>').join('');};
function num(id){const v=parseFloat($(id).value);return Number.isFinite(v)?v:null}
function dataUrlBytes(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function reconstructedSignature(){const img=new Image();img.src=SIG;await img.decode();const c=document.createElement('canvas');c.width=375;c.height=666;const x=c.getContext('2d');x.clearRect(0,0,375,666);x.drawImage(img,38,295,269,105);return dataUrlBytes(c.toDataURL('image/png'));}
async function saveBlob(blob,name,mime){if(window.Android&&Android.saveBase64){const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});Android.saveBase64(b64,mime,name);return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('sign').onclick=async()=>{if(!selected.length)return;const btn=$('sign');btn.disabled=true;$('status').textContent='Aplicando assinatura...';try{const CM=72/2.54,wcm=Math.max(1,Math.min(12,num('width')||4.1)),bottom=num('bottom'),top=num('top'),left=num('left'),right=num('right'),sigBytes=await reconstructedSignature(),out=[];for(let i=0;i<selected.length;i++){$('status').textContent=`Assinando ${i+1} de ${selected.length}...`;const f=selected[i],bytes=new Uint8Array(await f.arrayBuffer()),pdf=await PDFLib.PDFDocument.load(bytes),img=await pdf.embedPng(sigBytes),page=pdf.getPages()[0],pw=page.getWidth(),ph=page.getHeight(),iw=wcm*CM,ih=iw*(img.height/img.width);let x=(pw-iw)/2,y=(bottom!==null?bottom:8)*CM;if(left!==null)x=left*CM;else if(right!==null)x=pw-iw-right*CM;if(top!==null)y=ph-ih-top*CM;y=Math.max(0,Math.min(ph-ih,y));x=Math.max(0,Math.min(pw-iw,x));page.drawImage(img,{x,y,width:iw,height:ih});out.push({name:f.name.replace(/\.pdf$/i,'')+'_assinado.pdf',bytes:await pdf.save()})}if(out.length===1)await saveBlob(new Blob([out[0].bytes],{type:'application/pdf'}),out[0].name,'application/pdf');else{const z=new JSZip();out.forEach(o=>z.file(o.name,o.bytes));await saveBlob(await z.generateAsync({type:'blob'}),'notas_assinadas.zip','application/zip')}$('status').textContent='Concluído. Arquivo salvo em Downloads/Assinador PDF.'}catch(e){console.error(e);$('status').textContent='Erro ao assinar: '+e.message}finally{btn.disabled=false}};
</script>
</body>
</html>
