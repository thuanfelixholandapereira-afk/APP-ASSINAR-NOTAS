plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qrz.assinadorpdf'
    compileSdk 35

    defaultConfig {
        applicationId "com.qrz.assinadorpdf.lucasvisual"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "2.0-lucas-visual"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
