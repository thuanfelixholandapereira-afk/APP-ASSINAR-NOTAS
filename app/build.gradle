plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qrz.assinadorpdf'
    compileSdk 35

    defaultConfig {
        applicationId "com.qrz.assinadorpdflucas"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0-lucas"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
